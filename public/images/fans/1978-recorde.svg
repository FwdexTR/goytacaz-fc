<stop offset="0" stop-color="#061a45" stop-opacity="0.55"/><stop offset="0.45" stop-color="#061a45" stop-opacity="0"/><stop offset="1" stop-color="#061a45" stop-opacity="0.8"/>
</linearGradient>
</defs>
<rect width="1600" height="1000" fill="url(#bg)"/>
<rect width="1600" height="1000" fill="url(#glow)"/>
<rect x="1501" y="-1000" width="196" height="3000" fill="#4a7ce6" opacity="0.068" transform="rotate(18 800 500)"/><rect x="957" y="-1000" width="149" height="3000" fill="#4a7ce6" opacity="0.096" transform="rotate(18 800 500)"/><rect x="300" y="-1000" width="82" height="3000" fill="#4a7ce6" opacity="0.110" transform="rotate(18 800 500)"/><rect x="0" y="-1000" width="42" height="3000" fill="#4a7ce6" opacity="0.099" transform="rotate(18 800 500)"/>
<circle cx="1435" cy="1" r="1229" fill="none" stroke="#4a7ce6" stroke-width="1.5" opacity="0.125"/><circle cx="835" cy="159" r="1357" fill="none" stroke="#4a7ce6" stroke-width="1.5" opacity="0.088"/><circle cx="211" cy="561" r="1144" fill="none" stroke="#4a7ce6" stroke-width="1.5" opacity="0.082"/>
