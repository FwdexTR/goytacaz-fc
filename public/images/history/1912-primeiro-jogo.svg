<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#061a45"/><stop offset="0.55" stop-color="#0f3480"/><stop offset="1" stop-color="#061a45"/>
</linearGradient>
<radialGradient id="glow" cx="4%" cy="25%" r="70%">
<stop offset="0" stop-color="#4a7ce6" stop-opacity="0.42"/><stop offset="1" stop-color="#4a7ce6" stop-opacity="0"/>
</radialGradient>
<pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
<circle cx="2.2" cy="2.2" r="1.5" fill="#4a7ce6" opacity="0.5"/>
</pattern>
<linearGradient id="dotsMask" x1="0" y1="1" x2="1" y2="0">
<stop offset="0" stop-color="#fff" stop-opacity="0.85"/><stop offset="0.7" stop-color="#fff" stop-opacity="0"/>
</linearGradient>
<mask id="mDots"><rect width="1600" height="1000" fill="url(#dotsMask)"/></mask>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
<rect width="4" height="1" fill="#000" opacity="0.16"/>
</pattern>
<filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
<linearGradient id="vig" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#061a45" stop-opacity="0.55"/><stop offset="0.45" stop-color="#061a45" stop-opacity="0"/><stop offset="1" stop-color="#061a45" stop-opacity="0.8"/>
</linearGradient>
</defs>
<rect width="1600" height="1000" fill="url(#bg)"/>
<rect width="1600" height="1000" fill="url(#glow)"/>
<rect x="611" y="-1000" width="115" height="3000" fill="#4a7ce6" opacity="0.106" transform="rotate(18 800 500)"/><rect x="83" y="-1000" width="56" height="3000" fill="#4a7ce6" opacity="0.107" transform="rotate(18 800 500)"/><rect x="67" y="-1000" width="42" height="3000" fill="#4a7ce6" opacity="0.085" transform="rotate(18 800 500)"/><rect x="573" y="-1000" width="84" height="3000" fill="#4a7ce6" opacity="0.056" transform="rotate(18 800 500)"/>
<circle cx="495" cy="345" r="1289" fill="none" stroke="#4a7ce6" stroke-width="1.5" opacity="0.081"/><circle cx="38" cy="764" r="951" fill="none" stroke="#4a7ce6" stroke-width="1.5" opacity="0.092"/><circle cx="124" cy="995" r="562" fill="none" stroke="#4a7ce6" stroke-width="1.5" opacity="0.131"/>
<rect width="1600" height="1000" fill="url(#dots)" mask="url(#mDots)" opacity="0.5"/>
<rect width="1600" height="1000" fill="url(#scan)"/>
<text x="1552" y="956" text-anchor="end" font-family="Impact, 'Arial Black', sans-serif" font-size="340" fill="#4a7ce6" opacity="0.14" letter-spacing="-6">1912</text>
<rect width="1600" height="1000" fill="url(#vig)"/>
<rect width="1600" height="1000" filter="url(#grain)" opacity="0.22" style="mix-blend-mode:overlay"/>
<rect x="24" y="24" width="1552" height="952" fill="none" stroke="#f7f8fa" stroke-opacity="0.14"/>
<text x="48" y="954" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#f7f8fa" opacity="0.5" letter-spacing="5">PRIMEIRO JOGO</text>
</svg>