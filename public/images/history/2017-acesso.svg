<rect x="1306" y="-1400" width="195" height="4200" fill="#4a7ce6" opacity="0.068" transform="rotate(18 700 700)"/><rect x="821" y="-1400" width="148" height="4200" fill="#4a7ce6" opacity="0.097" transform="rotate(18 700 700)"/><rect x="250" y="-1400" width="80" height="4200" fill="#4a7ce6" opacity="0.110" transform="rotate(18 700 700)"/><rect x="0" y="-1400" width="41" height="4200" fill="#4a7ce6" opacity="0.098" transform="rotate(18 700 700)"/>
<circle cx="1245" cy="0" r="1082" fill="none" stroke="#4a7ce6" stroke-width="1.5" opacity="0.123"/><circle cx="714" cy="235" r="1186" fill="none" stroke="#4a7ce6" stroke-width="1.5" opacity="0.088"/><circle cx="173" cy="802" r="993" fill="none" stroke="#4a7ce6" stroke-width="1.5" opacity="0.082"/>
