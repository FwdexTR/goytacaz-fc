<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#04102e"/><stop offset="0.55" stop-color="#0a265f"/><stop offset="1" stop-color="#04102e"/>
</linearGradient>
<radialGradient id="glow" cx="53%" cy="63%" r="70%">
<stop offset="0" stop-color="#245bd0" stop-opacity="0.42"/><stop offset="1" stop-color="#245bd0" stop-opacity="0"/>
</radialGradient>
<pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
<circle cx="2.2" cy="2.2" r="1.5" fill="#245bd0" opacity="0.5"/>
</pattern>
<linearGradient id="dotsMask" x1="0" y1="1" x2="1" y2="0">
<stop offset="0" stop-color="#fff" stop-opacity="0.85"/><stop offset="0.7" stop-color="#fff" stop-opacity="0"/>
</linearGradient>
<mask id="mDots"><rect width="1600" height="1000" fill="url(#dotsMask)"/></mask>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
<rect width="4" height="1" fill="#000" opacity="0.16"/>
</pattern>
<filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
<linearGradient id="vig" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#04102e" stop-opacity="0.55"/><stop offset="0.45" stop-color="#04102e" stop-opacity="0"/><stop offset="1" stop-color="#04102e" stop-opacity="0.8"/>
</linearGradient>
</defs>
<rect width="1600" height="1000" fill="url(#bg)"/>
<rect width="1600" height="1000" fill="url(#glow)"/>
<rect x="4" y="-1000" width="43" height="3000" fill="#245bd0" opacity="0.101" transform="rotate(18 800 500)"/><rect x="224" y="-1000" width="53" height="3000" fill="#245bd0" opacity="0.073" transform="rotate(18 800 500)"/><rect x="855" y="-1000" width="111" height="3000" fill="#245bd0" opacity="0.047" transform="rotate(18 800 500)"/><rect x="1446" y="-1000" width="175" height="3000" fill="#245bd0" opacity="0.041" transform="rotate(18 800 500)"/>
<circle cx="1" cy="896" r="781" fill="none" stroke="#245bd0" stroke-width="1.5" opacity="0.106"/><circle cx="316" cy="989" r="457" fill="none" stroke="#245bd0" stroke-width="1.5" opacity="0.148"/><circle cx="976" cy="733" r="434" fill="none" stroke="#245bd0" stroke-width="1.5" opacity="0.177"/>
<rect width="1600" height="1000" fill="url(#dots)" mask="url(#mDots)" opacity="0.5"/>
<rect width="1600" height="1000" fill="url(#scan)"/>

<rect width="1600" height="1000" fill="url(#vig)"/>
<rect width="1600" height="1000" filter="url(#grain)" opacity="0.22" style="mix-blend-mode:overlay"/>
<rect x="24" y="24" width="1552" height="952" fill="none" stroke="#f7f8fa" stroke-opacity="0.14"/>
<text x="48" y="954" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#f7f8fa" opacity="0.5" letter-spacing="5">HOJE</text>
</svg>