<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 900" width="2000" height="900" role="img">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#04102e"/><stop offset="0.55" stop-color="#0a265f"/><stop offset="1" stop-color="#04102e"/>
</linearGradient>
<radialGradient id="glow" cx="18%" cy="0%" r="70%">
<stop offset="0" stop-color="#245bd0" stop-opacity="0.42"/><stop offset="1" stop-color="#245bd0" stop-opacity="0"/>
</radialGradient>
<pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
<circle cx="2.2" cy="2.2" r="1.5" fill="#245bd0" opacity="0.5"/>
</pattern>
<linearGradient id="dotsMask" x1="0" y1="1" x2="1" y2="0">
<stop offset="0" stop-color="#fff" stop-opacity="0.85"/><stop offset="0.7" stop-color="#fff" stop-opacity="0"/>
</linearGradient>
<mask id="mDots"><rect width="2000" height="900" fill="url(#dotsMask)"/></mask>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
<rect width="4" height="1" fill="#000" opacity="0.16"/>
</pattern>
<filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
<linearGradient id="vig" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#04102e" stop-opacity="0.55"/><stop offset="0.45" stop-color="#04102e" stop-opacity="0"/><stop offset="1" stop-color="#04102e" stop-opacity="0.8"/>
</linearGradient>
</defs>
<rect width="2000" height="900" fill="url(#bg)"/>
<rect width="2000" height="900" fill="url(#glow)"/>
<rect x="1873" y="-900" width="196" height="2700" fill="#245bd0" opacity="0.068" transform="rotate(18 1000 450)"/><rect x="1188" y="-900" width="149" height="2700" fill="#245bd0" opacity="0.097" transform="rotate(18 1000 450)"/><rect x="369" y="-900" width="81" height="2700" fill="#245bd0" opacity="0.110" transform="rotate(18 1000 450)"/><rect x="0" y="-900" width="42" height="2700" fill="#245bd0" opacity="0.098" transform="rotate(18 1000 450)"/>
<circle cx="1788" cy="0" r="1540" fill="none" stroke="#245bd0" stroke-width="1.5" opacity="0.124"/><circle cx="1036" cy="146" r="1695" fill="none" stroke="#245bd0" stroke-width="1.5" opacity="0.088"/><circle cx="258" cy="508" r="1427" fill="none" stroke="#245bd0" stroke-width="1.5" opacity="0.082"/>
<rect width="2000" height="900" fill="url(#dots)" mask="url(#mDots)" opacity="0.5"/>
<rect width="2000" height="900" fill="url(#scan)"/>

<rect width="2000" height="900" fill="url(#vig)"/>
<rect width="2000" height="900" filter="url(#grain)" opacity="0.22" style="mix-blend-mode:overlay"/>
<rect x="24" y="24" width="1952" height="852" fill="none" stroke="#f7f8fa" stroke-opacity="0.14"/>
<text x="48" y="854" font-family="Helvetica, Arial, sans-serif" font-size="23" fill="#f7f8fa" opacity="0.5" letter-spacing="5">LUZ ACESA</text>
</svg>